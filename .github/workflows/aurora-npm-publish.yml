name: Publish AurorA Studio to npm

on:
  release:
    types:
      - published

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: startsWith(github.event.release.tag_name, 'aurora-v')
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: aurora-studio

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Ensure trusted-publishing npm CLI
        run: npm install --global "npm@^11.5.1"

      - name: Verify release tag matches package version
        env:
          AURORA_RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node --input-type=module -e "
            import fs from 'node:fs';
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const expected = 'aurora-v' + pkg.version;
            if (process.env.AURORA_RELEASE_TAG !== expected) {
              console.error('Release tag must equal ' + expected);
              process.exit(2);
            }
          "

      - name: Run tests
        run: npm test

      - name: Package audit
        run: node ./scripts/package-audit.mjs

      - name: Installed package smoke
        run: node ./scripts/package-smoke.mjs

      - name: Release gate
        run: npm run release:gate

      - name: Publish with npm trusted publishing
        run: npm publish --access public
