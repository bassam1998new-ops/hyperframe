name: AurorA Studio Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "aurora-studio/**"
      - ".github/workflows/aurora-studio-tests.yml"
  pull_request:
    paths:
      - "aurora-studio/**"
      - ".github/workflows/aurora-studio-tests.yml"

permissions:
  contents: read

concurrency:
  group: aurora-studio-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node 22 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    defaults:
      run:
        working-directory: aurora-studio

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: CLI smoke
        run: node ./bin/aurora-studio.mjs help

      - name: HyperFrames install plan smoke
        run: node ./bin/aurora-studio.mjs hyperframe install --dry-run

      - name: HyperFrames exact core compatibility smoke
        run: |
          node ./bin/aurora-studio.mjs hyperframe install
          node ./bin/aurora-studio.mjs hyperframe doctor
          node ./bin/aurora-studio.mjs hyperframe run --help

      - name: Ensure FFmpeg on Ubuntu
        if: runner.os == 'Linux'
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Ensure FFmpeg on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue) -or -not (Get-Command ffprobe -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
          }
          $ffmpeg = (Get-Command ffmpeg).Source
          $ffprobe = (Get-Command ffprobe).Source
          $bin = Split-Path $ffmpeg
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $ffmpeg -version | Select-Object -First 1
          & $ffprobe -version | Select-Object -First 1

      - name: Run tests
        run: npm test

      - name: Package dry run
        run: npm pack --dry-run

      - name: Package audit
        run: node ./scripts/package-audit.mjs

      - name: Installed package smoke
        run: node ./scripts/package-smoke.mjs

      - name: Release readiness status
        run: npm run release:status


  visual_qa:
    name: Studio visual / accessibility QA
    needs:
      - test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: aurora-studio

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install UI QA dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Ensure Chrome and FFmpeg
        run: |
          command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Render canonical Studio viewports and run axe
        run: npm run ui:qa

      - name: Upload Studio QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aurora-studio-ui-qa
          path: aurora-studio/artifacts/ui-qa/
          if-no-files-found: error
          retention-days: 14
