name: AurorA Studio Tests

on:
  push:
    branches:
      - feat/aurora-studio-foundation
    paths:
      - "aurora-studio/**"
      - ".github/workflows/aurora-studio-tests.yml"
  pull_request:
    paths:
      - "aurora-studio/**"
      - ".github/workflows/aurora-studio-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aurora-studio
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: aurora-studio/package.json
      - name: Run tests
        run: npm test
