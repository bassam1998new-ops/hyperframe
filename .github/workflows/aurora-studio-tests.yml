name: AurorA Studio Tests

on:
  push:
    branches:
      - main
      - "feat/aurora-studio-*"
    paths:
      - "aurora-studio/**"
      - ".github/workflows/aurora-studio-tests.yml"
  pull_request:
    paths:
      - "aurora-studio/**"
      - ".github/workflows/aurora-studio-tests.yml"

permissions:
  contents: read

jobs:
  test:
    name: Node 22 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    defaults:
      run:
        working-directory: aurora-studio

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: CLI smoke
        run: node ./bin/aurora-studio.mjs help

      - name: HyperFrames install plan smoke
        run: node ./bin/aurora-studio.mjs hyperframe install --dry-run

      - name: Run tests
        run: npm test

      - name: Package dry run
        run: npm pack --dry-run

      - name: Release readiness status
        run: npm run release:status
